name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type-check with Mypy
        run: mypy src/ivimbench

      - name: Run deterministic Pytest suite
        run: pytest -q

      - name: Execute CLI smoke benchmark (<10s)
        run: ivimbench demo

      - name: Build and verify wheel & sdist
        run: |
          python -m build
          twine check dist/*
          ls -lh dist/*.whl dist/*.tar.gz
