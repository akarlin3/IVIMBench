name: Publish Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build & Validate Release Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build & verification tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and pure-Python wheel
        run: python -m build

      - name: Check package metadata with Twine
        run: twine check dist/*

      - name: Smoke-test built wheel in isolated environment
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
          /tmp/wheel-smoke/bin/ivimbench --version
          /tmp/wheel-smoke/bin/ivimbench demo

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ivimbench-dist
          path: dist/*

      - name: Attach artifacts to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "IVIMBench $TAG_NAME" --generate-notes
          fi
