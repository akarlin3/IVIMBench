[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "ivimbench"
version = "1.5.0"
description = "Extensible quantitative-MRI uncertainty, acquisition-design, repeatability, and clinical decision-utility benchmark suite for IVIM diffusion MRI"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Avery Karlin", email = "ak5232@columbia.edu" }
]
maintainers = [
    { name = "Avery Karlin", email = "ak5232@columbia.edu" }
]
keywords = [
    "IVIM",
    "diffusion MRI",
    "DWI",
    "digital reference object",
    "uncertainty quantification",
    "calibration",
    "conformal prediction",
    "Cramer-Rao lower bound",
    "experimental design",
    "value of information",
    "repeatability",
    "OSIPI",
    "MR-Linac",
    "NIfTI",
    "BIDS",
    "benchmark",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
io = [
    "nibabel>=5.0",
    "pydicom>=2.4",
]
ecosystem = [
    "conformal-ivim>=1.0.0",
]
vis = [
    "matplotlib>=3.7.0",
    "seaborn>=0.11.0",
]
torch = [
    "torch>=2.0",
]
all = [
    "nibabel>=5.0",
    "pydicom>=2.4",
    "conformal-ivim>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.11.0",
    "torch>=2.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.11.0",
]

[project.scripts]
ivimbench = "ivimbench.cli:main"

[project.urls]
Homepage = "https://github.com/akarlin3/IVIMBench"
Documentation = "https://github.com/akarlin3/IVIMBench#readme"
Repository = "https://github.com/akarlin3/IVIMBench"
Issues = "https://github.com/akarlin3/IVIMBench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ivimbench"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 105
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/ivimbench"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
